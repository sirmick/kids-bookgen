<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M20 4a12 12 0 1 0 8 20A10 10 0 0 1 20 4z%27 fill=%27%23e8b84a%27/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nighttime Books</title>
<meta name="description" content="AI-illustrated bedtime and learn-to-read picture books for a Bigme HiBreak e-ink reader.">
<meta property="og:title" content="Nighttime Books">
<meta property="og:description" content="AI-illustrated bedtime and learn-to-read picture books. Tap through a finished book.">
<meta property="og:image" content="https://sirmick.github.io/kids-bookgen/examples/farm/cover.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #e9e5dc; --ink: #23211d; --muted: #6f6a62; --line: #cfc8ba; --bezel: #2b2a28; --accent: #3d6b8f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1a1918; --ink: #ece7de; --muted: #a39d93; --line: #3b3832; --bezel: #0d0d0c; --accent: #7fb0d6; }
}
:root[data-theme="dark"] { --bg: #1a1918; --ink: #ece7de; --muted: #a39d93; --line: #3b3832; --bezel: #0d0d0c; --accent: #7fb0d6; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
a { color: var(--accent); }
button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .35; cursor: default; }

/* shelf */
#shelf { max-width: 980px; margin: 0 auto; padding: 32px 16px 48px; }
#shelf h1 { font: 700 30px/1.15 "Noto Serif", Georgia, serif; margin: 0 0 6px; }
#shelf .lede { color: var(--muted); margin: 0 0 24px; max-width: 62ch; }
.covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 22px; }
@media (max-width: 480px) { .covers { grid-template-columns: 1fr 1fr; gap: 14px; } }
.covers a { text-decoration: none; color: inherit; display: grid; gap: 8px; }
.covers img { width: 100%; aspect-ratio: 1072 / 1448; object-fit: cover; display: block; background: #fff;
  border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.15), 0 6px 18px rgba(0,0,0,.12); transition: transform .15s; }
.covers a:hover img { transform: translateY(-3px); }
.covers .t { font: 700 15px/1.25 "Noto Serif", Georgia, serif; }
.covers .k { color: var(--muted); font-size: 12px; }
#shelf footer { margin-top: 36px; color: var(--muted); font-size: 13px; }

/* reader */
#reader { height: 100%; display: grid; grid-template-rows: 1fr auto; justify-items: center; gap: 10px;
  padding: max(12px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom)); }
.device { background: var(--bezel); padding: 14px; border-radius: 22px; align-self: center;
  height: min(100%, calc((100vw - 32px - 28px) * 1448 / 1072 + 28px)); aspect-ratio: auto; display: flex; }
@media (max-width: 520px) { .device { padding: 0; border-radius: 0; background: none; height: min(100%, calc((100vw - 32px) * 1448 / 1072)); } }
#page { position: relative; height: 100%; aspect-ratio: 1072 / 1448; background: #fff; overflow: hidden;
  cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
#page img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.panel { position: absolute; background: #fff; border: solid #000; color: #000; display: flex; flex-direction: column;
  justify-content: center; text-align: center; }
.panel .w { font-family: "Andika", sans-serif; font-weight: 700; line-height: 1; }
.panel .s { white-space: pre-wrap; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
.bar .title { font: 700 15px "Noto Serif", Georgia, serif; }
.bar .count { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: center; }
.hint { color: var(--muted); font-size: 12px; }
#toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 6px 14px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
.hidden { display: none !important; }
</style>
</head>
<body>
<section id="shelf" class="hidden">
  <h1>Nighttime Books</h1>
  <p class="lede">Twelve-page picture books illustrated with Nano Banana and read on a Bigme HiBreak colour e-ink tablet.
    This is what they look like on the device: tap the right side of a page to go forward, the left side to go back.</p>
  <div class="covers" id="covers"></div>
  <footer>Made with the <a href="./">book generator</a> · <a href="https://github.com/sirmick/kids-bookgen">source</a></footer>
</section>

<section id="reader" class="hidden">
  <div class="device"><div id="page" aria-live="polite"></div></div>
  <div class="bar">
    <button id="home" title="All books">☰ Books</button>
    <button id="prev" aria-label="Previous page">‹</button>
    <span class="count" id="count"></span>
    <button id="next" aria-label="Next page">›</button>
    <button id="share" title="Copy a link to this page">Copy link</button>
  </div>
</section>
<div id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const W0 = 1072;                 // the app's geometry is in device pixels; everything below scales from this width
let index, book, slug, pageNo = 0, images = [];

async function load() {
  index = await fetch("examples/index.json").then(r => r.json());
  window.addEventListener("popstate", route);
  route();
}

function route() {
  const q = new URLSearchParams(location.search);
  const s = q.get("book");
  if (s && index.books[s]) openBook(s, Math.max(0, parseInt(q.get("p") || "0", 10) || 0));
  else showShelf();
}

function showShelf() {
  document.title = "Nighttime Books";
  $("#reader").classList.add("hidden"); $("#shelf").classList.remove("hidden");
  $("#covers").innerHTML = Object.entries(index.books).map(([s, b]) =>
    `<a href="?book=${encodeURIComponent(s)}" data-slug="${esc(s)}"><img src="examples/${esc(s)}/cover.webp" alt="" loading="lazy">
      <span class="t">${esc(b.title)}</span><span class="k">${/^r\d\d-/.test(s) ? "Learning to read" : "Bedtime"}</span></a>`).join("");
}
$("#covers").addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a || e.metaKey || e.ctrlKey) return;
  e.preventDefault(); history.pushState(null, "", a.getAttribute("href")); route();
});

async function openBook(s, p) {
  if (slug !== s) {
    book = await fetch(`books/${s}.json`).then(r => r.json()); slug = s;
    book.reading = !!book.cast?.length;
    // page 0 is the cover, then the book's pages; preload them all (about 50 KB each)
    images = ["cover", ...book.pages.map(pg => "p" + String(pg.n).padStart(2, "0"))].map(n => {
      const im = new Image(); im.src = `examples/${s}/${n}.webp`; im.alt = ""; return im;
    });
  }
  document.title = `${book.title} · Nighttime Books`;
  $("#shelf").classList.add("hidden"); $("#reader").classList.remove("hidden");
  show(Math.min(p, book.pages.length));
}

function show(n) {
  pageNo = n;
  const url = `?book=${encodeURIComponent(slug)}${n ? "&p=" + n : ""}`;
  if (location.search !== url) history.replaceState(null, "", url);
  const el = $("#page"); el.innerHTML = ""; el.append(images[n]);
  if (n > 0) {
    const p = book.pages[n - 1];
    const panel = document.createElement("div"); panel.className = "panel";
    if (book.reading && p.word) { const w = document.createElement("div"); w.className = "w"; w.textContent = p.word; panel.append(w); }
    if (p.text) { const t = document.createElement("div"); t.className = "s"; t.textContent = p.text; panel.append(t); }
    if (panel.children.length) { el.append(panel); layout(); }
  }
  $("#count").textContent = n === 0 ? "cover" : `${n} / ${book.pages.length}`;
  $("#prev").disabled = n === 0;
  el.setAttribute("aria-label", n === 0 ? `${book.title}, cover` : `Page ${n}: ${book.pages[n - 1].text}`);
}

/* Same geometry as PageView.java, scaled from 1072 px wide. */
function layout() {
  const el = $("#page"), panel = $(".panel", el); if (!panel) return;
  const W = el.clientWidth, H = el.clientHeight, k = W / W0, m = W * 0.03;
  const p = book.pages[pageNo - 1], word = $(".w", panel), text = $(".s", panel);
  Object.assign(panel.style, { borderWidth: Math.max(1, 4 * k) + "px", borderRadius: m + "px" });
  if (!book.reading) {
    const band = H / 4, pad = m * 1.2;
    Object.assign(panel.style, { left: m + "px", right: m + "px", height: band - 1.6 * m + "px", padding: pad + "px",
      top: p.text_pos === "top" ? m + "px" : "", bottom: p.text_pos === "top" ? "" : m + "px",
      fontFamily: '"Noto Serif", Georgia, serif', lineHeight: 1.2 });
    // largest size that fits, from 5% of the width down to 3.4%, like the app
    for (let size = W * 0.05; size >= W * 0.034; size -= 2 * k) {
      text.style.fontSize = size + "px";
      if (panel.scrollHeight <= panel.clientHeight + 1) break;
    }
  } else {
    const pad = m * 0.96, boxW = (W - 2 * m) * 0.8, maxInner = H * 0.42 - 2 * pad - m;
    Object.assign(panel.style, { left: (W - boxW) / 2 + "px", width: boxW + "px", bottom: m + "px", top: "", height: "",
      padding: pad + "px", fontFamily: '"Andika", sans-serif', lineHeight: 1.15 });
    for (let scale = 1; scale >= 0.5; scale -= 0.05) {
      const ts = W * 0.064 * scale;
      if (text) text.style.fontSize = ts + "px";
      if (word) { word.style.fontSize = W * 0.102 * scale + "px"; word.style.marginBottom = text ? ts * 0.35 + "px" : "0"; }
      if (panel.clientHeight - 2 * pad <= maxInner) break;
    }
  }
}
new ResizeObserver(layout).observe($("#page"));
document.fonts?.ready.then(layout);

function go(d) {
  const n = pageNo + d;
  if (n < 0) return;
  if (n > book.pages.length) { history.pushState(null, "", location.pathname); showShelf(); return; }   // past the end -> shelf, like the app
  show(n);
}
$("#page").addEventListener("click", e => {
  const r = e.currentTarget.getBoundingClientRect();
  go((e.clientX - r.left) / r.width < 1 / 3 ? -1 : 1);
});
let sx = null;
$("#page").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
$("#page").addEventListener("touchend", e => {
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 40) { e.preventDefault(); go(dx < 0 ? 1 : -1); }
});
$("#prev").onclick = () => go(-1);
$("#next").onclick = () => go(1);
$("#home").onclick = () => { history.pushState(null, "", location.pathname); showShelf(); };
$("#share").onclick = async () => {
  const url = location.href;
  try { await navigator.clipboard.writeText(url); toast("Link copied"); }
  catch { prompt("Copy this link:", url); }
};
document.addEventListener("keydown", e => {
  if ($("#reader").classList.contains("hidden")) return;
  if (["ArrowRight", " ", "PageDown"].includes(e.key)) { e.preventDefault(); go(1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
  else if (e.key === "Escape") $("#home").click();
});
let tt;
function toast(s) { const t = $("#toast"); t.textContent = s; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1400); }

load().catch(e => { document.body.innerHTML = `<p style="padding:24px">Could not load the books (${esc(e.message)}). This page needs to be served over http, not opened from disk.</p>`; });
</script>
</body>
</html>
